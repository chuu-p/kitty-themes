# custom bg
background_image               ~/git/kitty-themes/images/misa-0.02.png
background_image_layout        cscaled

# custom font
font_size                      13.0
font_family                    family="Space Mono"
bold_font                      auto
italic_font                    auto
bold_italic_font               auto
disable_ligatures              always
font_features                  SpaceMono-Regular -liga
font_features                  SpaceMono-Bold -liga
font_features                  SpaceMono-Italic -liga
font_features                  SpaceMono-BoldItalic -liga
